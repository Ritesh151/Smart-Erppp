name: siddhivinayak_enterprise
description: Enterprise-grade ERP Business Management System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1
  flutter_riverpod: ^2.4.9

  # Local Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Navigation
  go_router: ^13.0.0

  # Internationalization
  intl: ^0.19.0

  # UI Components
  flutter_staggered_grid_view: ^0.7.0
  fl_chart: ^0.66.0
  cached_network_image: ^3.3.1
  flutter_slidable: ^3.0.1
  shimmer: ^3.0.0

  # Image Picking & Storage
  image_picker: ^1.0.7
  path_provider: ^2.1.2

  # Utilities
  uuid: ^4.3.3
  flutter_animate: ^4.5.0
  google_fonts: ^6.1.0
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/mock/
